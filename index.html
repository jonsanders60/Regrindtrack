<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RegrindTrack | Prototype</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf1fa;background:#0c1523}*{box-sizing:border-box}body{margin:0}header{padding:20px;background:#14243a;border-bottom:1px solid #304259}h1{margin:0;font-size:1.55rem}small,.muted{color:#a9bbd0}main{max-width:980px;margin:auto;padding:18px}nav{display:flex;gap:7px;overflow:auto;padding:12px 0}button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;background:#287ad6;color:white;font-weight:650}nav button{background:#24374d;white-space:nowrap}nav button.active{background:#287ad6}.panel{background:#15253a;border:1px solid #2a415b;border-radius:14px;padding:16px;margin:14px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.metric{background:#20344c;border-radius:12px;padding:14px}.metric strong{display:block;font-size:1.4rem;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:block;font-size:.9rem;color:#c4d3e4;margin:8px 0 5px}input,select{width:100%;padding:12px;border:1px solid #536a83;background:#0d1a2b;color:white;border-radius:8px;font:inherit}table{border-collapse:collapse;width:100%;font-size:.92rem}th,td{text-align:left;padding:11px 7px;border-bottom:1px solid #354b62}th{color:#aebfd3}.scroll{overflow-x:auto}.hidden{display:none}.warning{color:#ffca78}.ok{color:#87ddb2}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.secondary{background:#334961}.notice{padding:12px;border-radius:8px;background:#2b3746;margin-top:10px}footer{padding:15px;color:#9db1c7;text-align:center}#toast{min-height:1.4em;color:#a6e4bb}</style></head><body><header><h1>♻ RegrindTrack</h1><small>Local-only demonstration • fictional starting inventory • pounds (lb)</small></header><main><nav id="nav"></nav><p id="toast" role="status"></p><section id="dashboard"></section><section id="inventory" class="hidden"></section><section id="movement" class="hidden"></section><section id="shift" class="hidden"></section><section id="history" class="hidden"></section><section id="settings" class="hidden"></section></main><footer>Prototype only. Not approved for live factory records. Data stays in this browser unless exported.</footer><script>
const KEY='regrindtrack_v1';const types=['Blue','Mixed','Contaminated'];const places=['Yard A','Yard B','Line 1','Line 2','Line 3','Quarantine'];const actions=['Receive','Transfer','Consume','Loss / disposal','Place on hold','Release hold'];const demo=[{type:'Blue',location:'Yard A',status:'Available',qty:2400},{type:'Mixed',location:'Line 3',status:'Available',qty:1800},{type:'Contaminated',location:'Quarantine',status:'Hold',qty:650}];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.lots)||!Array.isArray(state.events))state={lots:structuredClone(demo),events:[],operator:'',shift:'Day'};let tab='dashboard';const el=id=>document.getElementById(id);const fmt=n=>Number(n).toLocaleString(undefined,{maximumFractionDigits:2});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const sum=(filter=()=>true)=>state.lots.filter(filter).reduce((n,l)=>n+l.qty,0);const opt=(xs)=>xs.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');function show(t){tab=t;render()}function render(){el('nav').innerHTML=['dashboard','inventory','movement','shift','history','settings'].map(x=>`<button class="${tab===x?'active':''}" data-tab="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));['dashboard','inventory','movement','shift','history','settings'].forEach(x=>el(x).classList.toggle('hidden',x!==tab));renderDashboard();renderInventory();renderMovement();renderShift();renderHistory();renderSettings()}
function renderDashboard(){let avail=sum(l=>l.status==='Available'),hold=sum(l=>l.status==='Hold');el('dashboard').innerHTML=`<h2>Current inventory</h2><div class="cards"><div class="metric">Available<strong>${fmt(avail)} lb</strong></div><div class="metric">On hold<strong>${fmt(hold)} lb</strong></div><div class="metric">All material<strong>${fmt(avail+hold)} lb</strong></div><div class="metric">Locations in use<strong>${new Set(state.lots.filter(l=>l.qty>0).map(l=>l.location)).size}</strong></div></div><div class="panel"><h3>Material totals</h3><div class="cards">${types.map(t=>`<div class="metric">${t}<strong>${fmt(sum(l=>l.type===t))} lb</strong><small>Available: ${fmt(sum(l=>l.type===t&&l.status==='Available'))} lb</small></div>`).join('')}</div></div><div class="panel"><h3>By location</h3><div class="scroll"><table><thead><tr><th>Location</th><th>Available</th><th>Hold</th></tr></thead><tbody>${places.map(p=>`<tr><td>${p}</td><td>${fmt(sum(l=>l.location===p&&l.status==='Available'))} lb</td><td>${fmt(sum(l=>l.location===p&&l.status==='Hold'))} lb</td></tr>`).join('')}</tbody></table></div></div><p class="muted">Totals reflect this browser's saved entries only; they are not synchronized with other devices.</p>`}
function renderInventory(){el('inventory').innerHTML=`<h2>Inventory by material and location</h2><div class="panel scroll"><table><thead><tr><th>Material</th><th>Location</th><th>Status</th><th>Weight</th></tr></thead><tbody>${state.lots.filter(l=>l.qty>0).sort((a,b)=>a.location.localeCompare(b.location)).map(l=>`<tr><td>${l.type}</td><td>${l.location}</td><td class="${l.status==='Hold'?'warning':'ok'}">${l.status}</td><td>${fmt(l.qty)} lb</td></tr>`).join('')||'<tr><td colspan="4">No inventory</td></tr>'}</tbody></table></div>`}
function renderMovement(){el('movement').innerHTML=`<h2>Record a material movement</h2><form id="moveForm" class="panel"><div class="grid"><div><label for="action">Action</label><select id="action">${opt(actions)}</select></div><div><label for="material">Material type</label><select id="material">${opt(types)}</select></div><div><label for="source">From location</label><select id="source">${opt(places)}</select></div><div><label for="dest">To location</label><select id="dest">${opt(places)}</select></div><div><label for="weight">Weight (lb)</label><input id="weight" type="number" step="0.01" min="0.01" required placeholder="e.g. 500"></div><div><label for="person">Employee / initials</label><input id="person" required value="${esc(state.operator)}" maxlength="60"></div><div><label for="shiftName">Shift</label><select id="shiftName">${opt(['Day','Evening','Night'])}</select></div><div><label for="note">Notes (optional)</label><input id="note" maxlength="180" placeholder="Container or reason"></div></div><div id="movementHelp" class="notice"></div><div class="actions"><button type="submit">Save movement</button></div></form>`;el('shiftName').value=state.shift;el('action').onchange=updateHelp;updateHelp();el('moveForm').onsubmit=submitMovement}
function updateHelp(){const a=el('action').value;el('source').parentElement.style.display=a==='Receive'?'none':'';el('dest').parentElement.style.display=['Receive','Transfer'].includes(a)?'':'none';el('movementHelp').textContent=({Receive:'Adds new material to the destination. Contaminated material is automatically placed on hold.',Transfer:'Moves pounds from one location to another without changing the overall total.',Consume:'Subtracts material used by a production line. Hold material cannot be consumed.', 'Loss / disposal':'Subtracts pounds removed from inventory and records a reason.','Place on hold':'Changes available pounds to hold status at the same location.','Release hold':'Changes held pounds to available; requires authorized review in a real deployment.'})[a]}
function submitMovement(e){e.preventDefault();const action=el('action').value,type=el('material').value,source=el('source').value,dest=el('dest').value,qty=Number(el('weight').value),person=el('person').value.trim(),shift=el('shiftName').value,note=el('note').value.trim();if(!Number.isFinite(qty)||qty<=0||!person){alert('Enter a positive weight and employee name.');return}if(action==='Transfer'&&source===dest){alert('Choose a different destination.');return}if(action==='Loss / disposal'&&!note){alert('Enter a reason for loss or disposal.');return}const sourceStatus=action==='Release hold'?'Hold':'Available';if(action!=='Receive'){const available=sum(l=>l.type===type&&l.location===source&&l.status===sourceStatus);if(qty>available+0.000001){alert(`Insufficient ${sourceStatus.toLowerCase()} ${type} at ${source}. Recorded: ${fmt(available)} lb.`);return}}if(action==='Receive')add(type,dest,type==='Contaminated'?'Hold':'Available',qty);else{remove(type,source,sourceStatus,qty);if(action==='Transfer')add(type,dest,'Available',qty);if(action==='Place on hold')add(type,source,'Hold',qty);if(action==='Release hold')add(type,source,'Available',qty)}state.operator=person;state.shift=shift;state.events.unshift({time:new Date().toISOString(),action,type,source:action==='Receive'?'—':source,dest:['Receive','Transfer'].includes(action)?dest:'—',qty,person,shift,note});save();el('toast').textContent=`Saved ${action.toLowerCase()}: ${fmt(qty)} lb ${type}.`;show('dashboard')}
function add(type,location,status,qty){const l=state.lots.find(x=>x.type===type&&x.location===location&&x.status===status);if(l)l.qty=Math.round((l.qty+qty)*100)/100;else state.lots.push({type,location,status,qty})}function remove(type,location,status,qty){let rem=qty;for(const l of state.lots.filter(x=>x.type===type&&x.location===location&&x.status===status)){const taken=Math.min(rem,l.qty);l.qty=Math.round((l.qty-taken)*100)/100;rem-=taken;if(rem<.000001)break}state.lots=state.lots.filter(l=>l.qty>0)}
function renderShift(){let today=new Date().toLocaleDateString('en-CA');el('shift').innerHTML=`<h2>Shift closeout</h2><div class="panel"><div class="grid"><div><label for="reportDate">Date</label><input type="date" id="reportDate" value="${today}"></div><div><label for="reportShift">Shift</label><select id="reportShift">${opt(['Day','Evening','Night'])}</select></div></div><div class="actions"><button id="buildReport">Generate report</button><button class="secondary" id="copyReport">Copy report</button></div><pre id="reportText" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></div>`;el('reportShift').value=state.shift;el('buildReport').onclick=buildReport;el('copyReport').onclick=()=>navigator.clipboard.writeText(el('reportText').textContent).then(()=>el('toast').textContent='Report copied.').catch(()=>alert('Copy unavailable; select report text manually.'));buildReport()}
function buildReport(){const date=el('reportDate').value,shift=el('reportShift').value;const events=state.events.filter(x=>new Date(x.time).toLocaleDateString('en-CA')===date&&x.shift===shift);const totals=actions.map(a=>`${a}: ${fmt(events.filter(e=>e.action===a).reduce((s,e)=>s+e.qty,0))} lb`).join('\n');el('reportText').textContent=`REGRINDTRACK SHIFT SUMMARY\nDate: ${date} | Shift: ${shift}\nEntries: ${events.length}\n${totals}\n\nCURRENT INVENTORY (all shifts, as of now)\n${types.map(t=>`${t}: available ${fmt(sum(l=>l.type===t&&l.status==='Available'))} lb, hold ${fmt(sum(l=>l.type===t&&l.status==='Hold'))} lb`).join('\n')}\n\nNote: current balances are live browser totals, not a historical shift-end snapshot. No supervisor approval recorded.`}
function renderHistory(){el('history').innerHTML=`<h2>Movement history</h2><div class="panel"><div class="actions"><button id="exportEvents">Download history CSV</button><button id="exportInventory" class="secondary">Download inventory CSV</button></div><div class="scroll"><table><thead><tr><th>When</th><th>Action</th><th>Material</th><th>Weight</th><th>From → To</th><th>Employee</th><th>Shift</th><th>Note</th></tr></thead><tbody>${state.events.map(e=>`<tr><td>${esc(new Date(e.time).toLocaleString())}</td><td>${esc(e.action)}</td><td>${esc(e.type)}</td><td>${fmt(e.qty)}</td><td>${esc(e.source)} → ${esc(e.dest)}</td><td>${esc(e.person)}</td><td>${esc(e.shift)}</td><td>${esc(e.note)}</td></tr>`).join('')||'<tr><td colspan="8">No movements yet</td></tr>'}</tbody></table></div></div>`;el('exportEvents').onclick=()=>csv('regrind-movements.csv',['time','action','type','qty','source','dest','person','shift','note'],state.events);el('exportInventory').onclick=()=>csv('regrind-inventory.csv',['type','location','status','qty'],state.lots)}
function csv(name,fields,rows){const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const content=[fields.join(','),...rows.map(r=>fields.map(k=>cell(r[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function renderSettings(){el('settings').innerHTML=`<h2>Prototype settings</h2><div class="panel"><p>This is a single-device demonstration. It does not log in, synchronize, enforce employee roles, or prevent edits through browser developer tools. Employee names are free-text.</p><p class="warning">Do not enter confidential production data or use this prototype as an official inventory record.</p><div class="actions"><button id="backup">Export full JSON backup</button><button id="reset" class="secondary">Reset to fictional sample inventory</button></div></div>`;el('backup').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='regrindtrack-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};el('reset').onclick=()=>{if(confirm('Replace all local inventory and history with sample data? Export a backup first if needed.')){state={lots:structuredClone(demo),events:[],operator:'',shift:'Day'};save();render()}}}render();</script></body></html>
